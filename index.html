<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Ninja – Hand Tracking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a0f;font-family:'Nunito',sans-serif;overflow:hidden;width:100vw;height:100vh;}
  #app{position:relative;width:100vw;height:100vh;}
  #webcam{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;pointer-events:none;}
  #gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:none;}

  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 28px;pointer-events:none;z-index:10;}
  .hud-box{background:rgba(0,0,0,0.55);border:1.5px solid rgba(255,255,255,0.12);border-radius:16px;padding:10px 20px;backdrop-filter:blur(8px);}
  .hud-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:2px;}
  .hud-value{font-family:'Bangers',cursive;font-size:36px;letter-spacing:2px;color:#fff;line-height:1;}
  #scoreBox .hud-value{color:#ffe94d;}
  #comboBox .hud-value{color:#ff6b6b;}
  .lives-icons{display:flex;gap:6px;margin-top:4px;}
  .life-icon{font-size:22px;transition:all .3s;}
  .life-icon.lost{opacity:.2;filter:grayscale(1);}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,0.82);backdrop-filter:blur(12px);transition:opacity .4s;}
  .screen.hidden{opacity:0;pointer-events:none;}
  .screen-title{font-family:'Bangers',cursive;font-size:clamp(52px,10vw,96px);letter-spacing:4px;background:linear-gradient(135deg,#ffe94d,#ff6b35,#ff2d78);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:8px;filter:drop-shadow(0 0 30px rgba(255,107,53,.6));}
  .screen-sub{font-size:15px;color:rgba(255,255,255,.6);text-align:center;max-width:420px;line-height:1.7;margin-bottom:28px;}
  .btn{font-family:'Bangers',cursive;font-size:24px;letter-spacing:3px;padding:14px 48px;border:none;border-radius:50px;cursor:pointer;transition:all .2s;}
  .btn-primary{background:linear-gradient(135deg,#ffe94d,#ff6b35);color:#1a0a00;box-shadow:0 0 30px rgba(255,107,53,.5);}
  .btn-primary:hover{transform:scale(1.07);box-shadow:0 0 50px rgba(255,107,53,.8);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .fruit-strip{font-size:42px;margin-bottom:24px;letter-spacing:8px;animation:bounce 1.4s ease-in-out infinite alternate;}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
  .how-to{display:flex;gap:20px;margin-bottom:32px;flex-wrap:wrap;justify-content:center;}
  .how-to-item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 18px;text-align:center;width:115px;}
  .how-to-item .icon{font-size:28px;margin-bottom:6px;}
  .how-to-item .desc{font-size:12px;color:rgba(255,255,255,.6);line-height:1.5;}
  #finalScore{font-family:'Bangers',cursive;font-size:72px;color:#ffe94d;filter:drop-shadow(0 0 20px rgba(255,233,77,.7));margin:8px 0 4px;}
  #highScoreLabel{font-size:13px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}
  #loadingBar{width:260px;height:6px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;margin-top:24px;}
  #loadingFill{height:100%;width:0%;background:linear-gradient(90deg,#ffe94d,#ff6b35);border-radius:10px;transition:width .4s;}
  #loadingText{font-size:13px;color:rgba(255,255,255,.45);margin-top:12px;letter-spacing:1px;}
  #comboPopup{position:absolute;font-family:'Bangers',cursive;font-size:52px;color:#ff6b6b;pointer-events:none;z-index:18;opacity:0;transform:translateX(-50%);text-shadow:0 0 20px rgba(255,107,107,.8);letter-spacing:3px;transition:opacity .7s,top .7s;}
</style>
</head>
<body>
<div id="app">
  <video id="webcam" autoplay muted playsinline></video>
  <canvas id="gameCanvas"></canvas>
  <div id="comboPopup"></div>

  <div id="hud">
    <div class="hud-box" id="scoreBox">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Lives</div>
      <div class="lives-icons" id="livesIcons">
        <span class="life-icon">🍉</span>
        <span class="life-icon">🍉</span>
        <span class="life-icon">🍉</span>
      </div>
    </div>
    <div class="hud-box" id="comboBox">
      <div class="hud-label">Combo</div>
      <div class="hud-value" id="comboVal">x1</div>
    </div>
  </div>

  <div class="screen" id="startScreen">
    <div class="fruit-strip">🍉 🍊 🍋 🍇 🍓</div>
    <div class="screen-title">FRUIT NINJA<br>Hand Tracking</div>
    <div class="screen-sub">Point your index finger at the camera.<br>Swipe fast to slash fruits — dodge the bombs!</div>
    <div class="how-to">
      <div class="how-to-item"><div class="icon">☝️</div><div class="desc">Point finger at camera</div></div>
      <div class="how-to-item"><div class="icon">✂️</div><div class="desc">Swipe fast to slash</div></div>
      <div class="how-to-item"><div class="icon">💣</div><div class="desc">Avoid bombs!</div></div>
      <div class="how-to-item"><div class="icon">🔥</div><div class="desc">Chain combos</div></div>
    </div>
    <button class="btn btn-primary" id="startBtn" disabled>Loading…</button>
    <div id="loadingBar"><div id="loadingFill"></div></div>
    <div id="loadingText">Starting camera &amp; AI model…</div>
  </div>

  <div class="screen hidden" id="gameOverScreen">
    <div class="screen-title">GAME OVER</div>
    <div class="screen-sub">Final Score</div>
    <div id="finalScore">0</div>
    <div id="highScoreLabel">HIGH SCORE: 0</div>
    <button class="btn btn-primary" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const video=document.getElementById('webcam');
let gameScale=1;

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  gameScale=Math.max(0.6,Math.min(canvas.width/1000,1.8));
}
resize();
window.addEventListener('resize',resize);

let state='loading';
let score=0,highScore=0,lives=3,combo=1,comboTimer=0;
let fruits=[],particles=[],halves=[],bladeTrail=[],scorePopups=[];
let fingerX=-999,fingerY=-999;
let frameCount=0,spawnTimer=0,spawnInterval=90;
let rafId=null,flashOpacity=0,flashColor='rgba(255,30,30,0.45)';

const FRUITS=[
  {emoji:'🍉',juice:'#c9184a',score:3,size:64},
  {emoji:'🍊',juice:'#e76f51',score:2,size:58},
  {emoji:'🍋',juice:'#ffd60a',score:2,size:56},
  {emoji:'🍇',juice:'#7c3aed',score:4,size:56},
  {emoji:'🍓',juice:'#c9184a',score:2,size:52},
  {emoji:'🍑',juice:'#ff8c00',score:3,size:56},
  {emoji:'🥝',juice:'#16a34a',score:3,size:54},
  {emoji:'🍍',juice:'#ca8a04',score:5,size:60},
  {emoji:'🫐',juice:'#4338ca',score:3,size:54},
];

function spawnFruit(){
  const isBomb=Math.random()<0.12;
  const x=90+Math.random()*(canvas.width-180);
  const vy=-(12+Math.random()*9);
  const vx=(Math.random()-0.5)*6;
  const spin=(Math.random()-0.5)*0.13;
  if(isBomb){
    fruits.push({x,y:canvas.height+70,vx,vy,spin,angle:0,isBomb:true,emoji:'💣',size:58*gameScale,sliced:false});
  }else{
    const t=FRUITS[Math.floor(Math.random()*FRUITS.length)];
    fruits.push({x,y:canvas.height+70,vx,vy,spin,angle:0,isBomb:false,sliced:false,...t,size:t.size*gameScale});
  }
}

function spawnParticles(x,y,color,n){
  n=n||16;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*7;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,color,size:(3+Math.random()*6)*gameScale,life:1,decay:0.025+Math.random()*0.03});
  }
}

function updateTrail(x,y){
  if(x<0)return;
  bladeTrail.push({x,y});
  if(bladeTrail.length>22)bladeTrail.shift();
}

function drawTrail(){
  if(bladeTrail.length<2)return;
  for(let i=1;i<bladeTrail.length;i++){
    const t=i/bladeTrail.length;
    const a=bladeTrail[i-1],b=bladeTrail[i];
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='hsla('+(38+t*30)+',100%,68%,'+(t*0.88)+')';
    ctx.lineWidth=t*12*gameScale;ctx.lineCap='round';
    ctx.shadowBlur=22*gameScale;ctx.shadowColor='hsla('+(38+t*30)+',100%,68%,0.7)';
    ctx.stroke();ctx.shadowBlur=0;
  }
}

function segCircle(ax,ay,bx,by,cx,cy,r){
  const dx=bx-ax,dy=by-ay,fx=ax-cx,fy=ay-cy;
  const A=dx*dx+dy*dy,B=2*(fx*dx+fy*dy),C=fx*fx+fy*fy-r*r;
  let d=B*B-4*A*C;if(d<0)return false;d=Math.sqrt(d);
  const t1=(-B-d)/(2*A),t2=(-B+d)/(2*A);
  return(t1>=0&&t1<=1)||(t2>=0&&t2<=1);
}

function checkSlice(f){
  if(f.sliced)return false;
  const r=f.size*0.82;
  const dx=fingerX-f.x,dy=fingerY-f.y;
  if(dx*dx+dy*dy<r*r)return true;
  for(let i=0;i<bladeTrail.length-1;i++){
    if(segCircle(bladeTrail[i].x,bladeTrail[i].y,bladeTrail[i+1].x,bladeTrail[i+1].y,f.x,f.y,r))return true;
  }
  return false;
}

function updateScoreUI(){document.getElementById('scoreVal').textContent=score;}
function updateComboUI(){document.getElementById('comboVal').textContent='x'+combo;}
function updateLivesUI(){document.querySelectorAll('.life-icon').forEach(function(el,i){el.classList.toggle('lost',i>=lives);});}

function showComboPopup(x,y,text){
  var el=document.getElementById('comboPopup');
  el.textContent=text;
  el.style.cssText='left:'+x+'px;top:'+y+'px;opacity:1;transition:none;transform:translateX(-50%)';
  setTimeout(function(){
    el.style.transition='opacity .7s,top .7s';
    el.style.opacity='0';
    el.style.top=(parseInt(y)-70)+'px';
  },50);
}

function flashScreen(c){
  flashColor=c;flashOpacity=1;
  function fade(){flashOpacity=Math.max(0,flashOpacity-0.07);if(flashOpacity>0)requestAnimationFrame(fade);}
  requestAnimationFrame(fade);
}

function loseLife(){
  lives=Math.max(0,lives-1);updateLivesUI();
  if(lives<=0)setTimeout(endGame,300);
}

function mainLoop(){
  rafId=requestAnimationFrame(mainLoop);
  if(state!=='playing')return;
  frameCount++;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // webcam bg
  if(video.readyState>=2){
    ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    ctx.restore();
  }
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,canvas.width,canvas.height);

  if(flashOpacity>0){
    ctx.globalAlpha=flashOpacity;ctx.fillStyle=flashColor;
    ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=1;
  }

  // spawn logic
  spawnTimer++;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0;spawnFruit();
    if(Math.random()<0.28)spawnFruit();
    spawnInterval=Math.max(36,90-Math.floor(score/12)*4);
  }

  comboTimer++;
  if(comboTimer>110){combo=1;updateComboUI();}

  var G=0.28;

  // fruits
  for(var i=fruits.length-1;i>=0;i--){
    var f=fruits[i];
    f.vy+=G;f.x+=f.vx;f.y+=f.vy;f.angle+=f.spin;

    if(!f.sliced&&f.y>canvas.height+80&&!f.isBomb){fruits.splice(i,1);loseLife();continue;}
    if(f.y>canvas.height+130){fruits.splice(i,1);continue;}

    if(!f.sliced&&checkSlice(f)){
      f.sliced=true;
      if(f.isBomb){
        spawnParticles(f.x,f.y,'#888888',22);
        flashScreen('rgba(255,20,20,0.5)');
        loseLife();
      }else{
        var pts=f.score*combo;
        score+=pts;updateScoreUI();
        combo++;comboTimer=0;updateComboUI();
        spawnParticles(f.x,f.y,f.juice,20);
        scorePopups.push({x:f.x,y:f.y-20,text:'+'+pts,life:1,size:26*gameScale});
        if(combo>2)showComboPopup(f.x,f.y-20,combo+'x COMBO!');
        halves.push({x:f.x,y:f.y,vx:f.vx-3.5,vy:f.vy-2,angle:f.angle,spin:-0.18,emoji:f.emoji,size:f.size,life:1});
        halves.push({x:f.x,y:f.y,vx:f.vx+3.5,vy:f.vy-2,angle:f.angle,spin:0.18,emoji:f.emoji,size:f.size,life:1});
      }
    }

    if(!f.sliced){
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.angle);
      ctx.globalAlpha=1;
      ctx.font=f.size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowBlur=25;ctx.shadowColor='rgba(255,255,255,0.8)';
      ctx.fillText(f.emoji,0,0);ctx.shadowBlur=0;ctx.restore();
    }
  }

  // halves
  for(var i=halves.length-1;i>=0;i--){
    var h=halves[i];
    h.vy+=G;h.x+=h.vx;h.y+=h.vy;h.angle+=h.spin;h.life-=0.022;
    if(h.life<=0||h.y>canvas.height+120){halves.splice(i,1);continue;}
    ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.angle);
    ctx.globalAlpha=h.life*0.85;
    ctx.font=Math.round(h.size*0.65)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h.emoji,0,0);ctx.globalAlpha=1;ctx.restore();
  }

  updateTrail(fingerX,fingerY);
  drawTrail();

  // particles
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    ctx.fillStyle=p.color+Math.floor(Math.min(1,p.life*1.2)*255).toString(16).padStart(2,'0');
    ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.fill();ctx.shadowBlur=0;
  }

  // score popups
  for(var i=scorePopups.length-1;i>=0;i--){
    var sp=scorePopups[i];
    sp.y-=1.3;sp.life-=0.025;
    if(sp.life<=0){scorePopups.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=sp.life;
    ctx.font='bold '+Math.round(sp.size)+'px Nunito';ctx.fillStyle='#ffe94d';ctx.textAlign='center';
    ctx.shadowBlur=12*gameScale;ctx.shadowColor='#ffe94d';ctx.fillText(sp.text,sp.x,sp.y);
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
  }

  // finger glow
  if(fingerX>0&&fingerY>0){
    const glowSize=38*gameScale;
    var grd=ctx.createRadialGradient(fingerX,fingerY,0,fingerX,fingerY,glowSize);
    grd.addColorStop(0,'rgba(255,233,77,1)');
    grd.addColorStop(0.35,'rgba(255,107,53,0.5)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(fingerX,fingerY,glowSize,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.shadowBlur=32*gameScale;ctx.shadowColor='#ffe94d';
    ctx.fill();ctx.shadowBlur=0;
  }
}

function idleLoop(){
  requestAnimationFrame(idleLoop);
  if(state==='playing')return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(video.readyState>=2){
    ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    ctx.restore();
  }
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,canvas.width,canvas.height);
}

function startGame(){
  score=0;lives=3;combo=1;comboTimer=0;
  fruits=[];particles=[];halves=[];bladeTrail=[];scorePopups=[];
  spawnTimer=0;spawnInterval=90;frameCount=0;flashOpacity=0;
  updateScoreUI();updateComboUI();updateLivesUI();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  state='playing';
  if(rafId)cancelAnimationFrame(rafId);
  mainLoop();
}

function endGame(){
  state='dead';
  if(score>highScore)highScore=score;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('highScoreLabel').textContent='HIGH SCORE: '+highScore;
  setTimeout(function(){document.getElementById('gameOverScreen').classList.remove('hidden');},600);
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',startGame);

function setProgress(pct,msg){
  document.getElementById('loadingFill').style.width=pct+'%';
  document.getElementById('loadingText').textContent=msg;
}

function onReady(){
  state='ready';
  var btn=document.getElementById('startBtn');
  btn.textContent='START GAME';btn.disabled=false;
  document.getElementById('loadingBar').style.display='none';
  document.getElementById('loadingText').style.display='none';
}

function initMediaPipe(){
  var hands=new Hands({locateFile:function(f){return'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;}});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.6});
  hands.onResults(function(results){
    if(!results.multiHandLandmarks||!results.multiHandLandmarks.length){fingerX=-999;fingerY=-999;return;}
    var tip=results.multiHandLandmarks[0][8];
    fingerX=(1-tip.x)*canvas.width;
    fingerY=tip.y*canvas.height;
  });

  var cam=new Camera(video,{
    onFrame:function(){return hands.send({image:video});},
    width:1280,height:720
  });

  cam.start().then(function(){
    setProgress(60,'Loading AI hand model…');
    setTimeout(function(){
      setProgress(100,'Ready! ✅');
      setTimeout(onReady,500);
    },1200);
  }).catch(function(){
    document.getElementById('loadingText').textContent='❌ Camera denied. Please allow camera access and reload.';
  });
}

setProgress(15,'Requesting camera…');
idleLoop();
initMediaPipe();
</script>
</body>
</html>
